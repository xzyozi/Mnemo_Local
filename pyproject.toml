[project]
name = "mnemo-local-tools"
version = "0.1.0"
description = "Local helper tools for Mnemo Local"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100
include = ["tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["tools"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tools"]
pythonpath = ["tools"]
