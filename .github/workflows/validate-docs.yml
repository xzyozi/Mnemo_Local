name: Validate docs

# docs/ 配下とルートのREADME.md・README.ja.mdについて、メタデータ・リンク・文字コードを検証する。
# Python はこのジョブ内でのみ使用する。

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**/*.md"
      - "README.md"
      - "README.ja.md"
      - ".github/scripts/validate_docs.py"
      - ".github/scripts/validateMermaidMarkdown.mjs"
      - ".github/workflows/validate-docs.yml"
      - ".github/workflows/validate-mermaid.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - "poetry.lock"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**/*.md"
      - "README.md"
      - "README.ja.md"
      - ".github/scripts/validate_docs.py"
      - ".github/scripts/validateMermaidMarkdown.mjs"
      - ".github/workflows/validate-docs.yml"
      - ".github/workflows/validate-mermaid.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "uv.lock"
      - "poetry.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs
        shell: bash
        run: python .github/scripts/validate_docs.py docs README.md README.ja.md
