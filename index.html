<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mnemo Local</title>
</head>

<body>
  <main>
    <h1>Mnemo Local</h1>
    <section>
      <button id="choose-folder" type="button">Markdownフォルダを選択</button>
      <label>
        またはファイルを選択（Markdown / 履歴・ブックマークJSON/HTML）
        <input id="choose-files" type="file" multiple accept=".md,.json,.html,.htm" />
      </label>
      <button id="clear-data-button" type="button">保存データをクリア</button>
    </section>
    <hr />
    <section id="timeline-section" style="margin-bottom: 24px;">
      <h2>月次興味変遷グラフ</h2>
      <div id="timeline-container" style="max-width: 800px; margin: 12px 0;"></div>
      <div id="topic-filter-status" style="display: none; margin-bottom: 8px;">
        <span id="selected-topic-label"></span>
        <button id="reset-topic-button" type="button" style="margin-left: 8px;">絞り込み解除</button>
      </div>
    </section>
    <hr />
    <section>
      <label>
        検索語
        <input id="search-query" type="search" />
      </label>
      <button id="search-button" type="button">検索</button>
    </section>
    <p id="status" role="status">初期化中...</p>
    <ol id="results"></ol>
  </main>
  <script type="module" src="./dist/index.js"></script>
</body>

</html>
